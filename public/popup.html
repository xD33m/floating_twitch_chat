<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Floating Twitch Chat</title>
		<link href="libs/water.dark.css" rel="stylesheet" />
		<link href="libs/pickr.nano.min.css" rel="stylesheet" />
		<link href="css/popup.css" rel="stylesheet" />
	</head>
	<body>
		<div id="frame">
			<p id="name">floating twitch chat</p>
			<input type="checkbox" id="compactMode" />
			<label for="compactMode">Compact Mode</label>
			<br />
			<input type="checkbox" id="disableOverlay" />
			<label for="disableOverlay">Disable Overlay</label>
			<br />
			<label for="pickr">Background Color:</label>
			<div class="color-picker" id="pickr"></div>
			<br />
			<label for="chatHeight">Chat height:</label>
			<input type="range" min="0" max="100" value="50" id="chatHeight" />
			<span style="position: absolute; right: 25px"><span id="heightValue"></span>%</span>
			<br />
			<label for="chatScale">Chat Scale:</label>
			<input type="range" min="1" max="20" value="10" style="top: 189px" id="chatScale" />
			<span style="position: absolute; right: 25px"><span id="scaleValue"></span>%</span>
			<br />
			<button id="reset">Reset to default</button>
		</div>
		<script src="libs/pickr.min.js"></script>
		<script src="app/popup.js"></script>
	</body>
</html>
