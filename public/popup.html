<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Floating Twitch Chat</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap"
		/>
		<link href="static/css/popup.css" rel="stylesheet" />
	</head>
	<body>
		<div id="frame">
			<p id="name">floating twitch chat</p>
			<p id="hint">
				The overlay only shows while the video player is fullscreen. Press
				<kbd>F</kbd> on Twitch.
			</p>
			<div class="row">
				<input type="checkbox" id="compactMode" />
				<label for="compactMode">Compact Mode</label>
			</div>
			<div class="row">
				<input type="checkbox" id="disableOverlay" />
				<label for="disableOverlay">Disable Overlay</label>
			</div>
			<div class="row">
				<label for="pickr">Background Color:</label>
				<div class="color-picker" id="pickr"></div>
			</div>
			<div class="row">
				<label for="chatHeight">Chat height:</label>
				<input type="range" min="0" max="100" value="50" id="chatHeight" />
				<span class="value"><span id="heightValue"></span>%</span>
			</div>
			<div class="row">
				<label for="chatScale">Chat Scale:</label>
				<input type="range" min="1" max="20" value="10" id="chatScale" />
				<span class="value"><span id="scaleValue"></span>%</span>
			</div>
			<button id="reset">Reset to default</button>
		</div>
		<script src="static/js/popup.js"></script>
	</body>
</html>
