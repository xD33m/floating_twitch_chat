name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Offline unit tests only. The *.live.js suites hit Twitch, BTTV, FFZ and
      # 7TV and run in the separate "Live API check" workflow.
      - name: Unit tests
        run: pnpm test

      - name: Build and zip
        run: pnpm build

      - name: Check the packed extension
        run: |
          node -e '
            const m = require("./build/manifest.json");
            if (m.manifest_version !== 3) throw new Error("not a Manifest V3 build");
            console.log(`manifest ok: ${m.name} v${m.version}`);
          '
          zip="dist/floating-twitch-chat-$(node -p 'require("./build/manifest.json").version').zip"
          test -s "$zip"
          unzip -l "$zip" | grep -q ' manifest.json$'
          echo "ZIP_PATH=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: floating-twitch-chat
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
