name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # The tag has to match manifest.json, so a release can never ship a zip
      # whose version Chrome reports differently.
      - name: Check tag against manifest version
        run: |
          version="$(node -p 'require("./build/manifest.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version (expected v$version)"
            exit 1
          fi
          echo "ZIP_PATH=dist/floating-twitch-chat-$version.zip" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP_PATH" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
